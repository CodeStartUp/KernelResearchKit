
name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

env:
  SOLUTION_FILE_PATH: drvloader.sln
  BUILD_CONFIGURATION: Release
  BUILD_PLATFORM: x64

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore Packages
        run: nuget restore "${{ env.SOLUTION_FILE_PATH }}"

      - name: Build
        shell: cmd
        run: |
          msbuild "${{ env.SOLUTION_FILE_PATH }}" ^
            /t:Rebuild ^
            /m ^
            /p:Configuration=${{ env.BUILD_CONFIGURATION }} ^
            /p:Platform=${{ env.BUILD_PLATFORM }}

      - name: Verify executable exists
        shell: cmd
        run: dir /s *.exe

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drvloader-windows-x64
          path: |
            bin/x64/Release/drvloader.exe

      # Update "Latest" release after every push to main
      - name: Update Latest Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            bin/x64/Release/drvloader.exe
          overwrite_files: true

      # Create versioned releases only when pushing tags like v1.0.0
      - name: Create Version Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            bin/x64/Release/drvloader.exe
          overwrite_files: true
